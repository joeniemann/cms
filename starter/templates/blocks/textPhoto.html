  <section class="band band--{{look}}">
    <div class="wrap">
      <div class="about-lead">
        <div data-reveal>
          <div class="eyebrow">{{eyebrow}}</div>
          <h2 class="h-section" style="margin:16px 0 22px">{{br headline}}</h2>
          <div class="body">
            {{#each paragraphs}}<p>{{rich this}}</p>
            {{/each}}</div>
          {{#if facts}}<div class="phead-stats{{alignClass factsAlign}}" style="margin-top:30px">
            {{#each facts}}<div class="phead-stat"><b>{{big}}</b><span>{{label}}</span></div>
            {{/each}}</div>
          {{/if}}{{#if buttons}}<div style="margin-top:30px;display:flex;gap:12px;flex-wrap:wrap">
            {{#each buttons}}{{> button}}
            {{/each}}</div>
          {{/if}}</div>
        <figure class="about-media" data-reveal data-reveal-delay="120">
          <img src="{{photoSrc photo}}" alt="{{photoAlt photo}}" loading="lazy" decoding="async">
        </figure>
      </div>
    </div>
  </section>
